name: Retry failed publish jobs

on:
  workflow_run:
    workflows:
      - Publish images
    types:
      - completed

concurrency:
  group: retry-failed-publish-jobs-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions: {}

jobs:
  retry-failed-jobs:
    name: Retry failed publication jobs
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3 &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Wait and rerun only failed jobs
        shell: bash
        env:
          FAILED_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          read_run_state() {
            gh api \
              --method GET \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '[.run_attempt, .status, .conclusion] | @tsv'
          }

          retry_is_current() {
            local state current_attempt current_status current_conclusion
            state="$(read_run_state)"
            IFS=$'\t' read -r current_attempt current_status current_conclusion <<< "${state}"
            [[ "${current_attempt}" == "${FAILED_ATTEMPT}" && \
               "${current_status}" == "completed" && \
               "${current_conclusion}" == "failure" ]]
          }

          if ! retry_is_current; then
            echo "Run ${RUN_ID} has already been retried or is no longer a completed failure."
            exit 0
          fi

          echo "Waiting 120 seconds before retrying failed jobs from run ${RUN_ID}, attempt ${FAILED_ATTEMPT}."
          sleep 120

          if ! retry_is_current; then
            echo "Run ${RUN_ID} changed while waiting; skipping a duplicate retry."
            exit 0
          fi

          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs" \
            --silent
          echo "Requested a rerun of failed jobs from run ${RUN_ID}."
