# Generated by `python -m scripts.container_engine generate-workflow`.
name: Retry failed publish jobs

on:
  workflow_run:
    workflows:
      - Publish images
    types:
      - completed

concurrency:
  group: retry-failed-publish-jobs-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions: {}

jobs:
  retry-failed-jobs:
    name: Retry failed publication jobs
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3 &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Wait and rerun only failed jobs
        shell: bash
        env:
          FAILED_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          read_run_state() {
            gh api \
              --method GET \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '[.run_attempt, .status, .conclusion] | @tsv'
          }

          retry_is_current() {
            local state current_attempt current_status current_conclusion
            state="$(read_run_state)"
            IFS=$'\t' read -r current_attempt current_status current_conclusion <<< "${state}"
            [[ "${current_attempt}" == "${FAILED_ATTEMPT}" && \
               "${current_status}" == "completed" && \
               "${current_conclusion}" == "failure" ]]
          }

          publication_jobs_only_failed() {
            local failed_jobs job_name job_leaf found_publication_failure=false
            failed_jobs="$(gh api --paginate \
              --method GET \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure") | .name')"
            while IFS= read -r job_name; do
              [[ -n "${job_name}" ]] || continue
              job_leaf="${job_name##*/}"
              job_leaf="${job_leaf# }"
              case "${job_leaf}" in
                "Publish "*|"Finalize release"|"Finalize release "*|"Finalize stage "*" release "*)
                  found_publication_failure=true
                  ;;
                *)
                  echo "Skipping automatic retry: failed job ${job_name} is outside publication/finalization."
                  return 1
                  ;;
              esac
            done <<< "${failed_jobs}"
            [[ "${found_publication_failure}" == true ]]
          }

          if ! retry_is_current; then
            echo "Run ${RUN_ID} has already been retried or is no longer a completed failure."
            exit 0
          fi
          if ! publication_jobs_only_failed; then
            echo "No eligible publication-only failure to retry."
            exit 0
          fi

          echo "Waiting 120 seconds before retrying failed jobs from run ${RUN_ID}, attempt ${FAILED_ATTEMPT}."
          sleep 120

          if ! retry_is_current; then
            echo "Run ${RUN_ID} changed while waiting; skipping a duplicate retry."
            exit 0
          fi
          if ! publication_jobs_only_failed; then
            echo "Failed job eligibility changed while waiting; skipping retry."
            exit 0
          fi

          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs" \
            --silent
          echo "Requested a rerun of failed jobs from run ${RUN_ID}."
