# Generated by `python -m scripts.container_engine generate-workflow`.
name: Monitor upstream releases

on:
  schedule:
    - cron: "13 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Discover releases without creating issues or update PRs.
        type: boolean
        default: true

concurrency:
  group: upstream-release-maintenance
  cancel-in-progress: false

permissions: {}

env:
  PYTHON_VERSION: "3.14"
  UV_VERSION: 0.12.23

jobs:
  discover:
    name: Discover stable upstream releases
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      has_updates: ${{ steps.plan.outputs.has_updates }}
      probe_matrix: ${{ steps.plan.outputs.probe_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          version: ${{ env.UV_VERSION }}
      - name: Plan missing lines and existing Engine updates
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run --frozen --python "${PYTHON_VERSION}" python -m scripts.upstream_releases \
            --output "${RUNNER_TEMP}/release-plan.json"
          uv run --frozen --python "${PYTHON_VERSION}" python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.workflow_config import RUNNERS
          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "release-plan.json").read_text())
          matrix = {"include": [
              {"line": update["line"], "version": update["version"], "arch": arch, "runner": runner}
              for update in plan["dockerUpdates"] for arch, runner in RUNNERS.items()
          ]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"has_updates={str(bool(plan['dockerUpdates'])).lower()}", file=output)
              print("probe_matrix=" + json.dumps(matrix, separators=(",", ":")), file=output)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print("## Upstream release plan\n\n```json\n" + json.dumps(plan, indent=2) + "\n```", file=summary)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-release-plan
          path: ${{ runner.temp }}/release-plan.json
          if-no-files-found: error
          retention-days: 7

  notify:
    name: Notify maintainers of missing image lines
    needs: discover
    if: github.event_name == 'schedule' || !inputs.dry_run
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-release-plan
          path: ${{ runner.temp }}/release-plan
      - name: Create deduplicated assigned issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --frozen --python "${PYTHON_VERSION}" python -m scripts.release_notifications
          --plan "${RUNNER_TEMP}/release-plan/release-plan.json"

  probe:
    name: Inspect Docker ${{ matrix.line }} on ${{ matrix.arch }}
    needs: discover
    if: needs.discover.outputs.has_updates == 'true' && (github.event_name == 'schedule' || !inputs.dry_run)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.probe_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          version: ${{ env.UV_VERSION }}
      - name: Hash official archives and inspect native component versions
        env:
          ENGINE_LINE: ${{ matrix.line }}
          ENGINE_VERSION: ${{ matrix.version }}
          ENGINE_ARCH: ${{ matrix.arch }}
        run: >-
          uv run --frozen --python "${PYTHON_VERSION}" python -m scripts.docker_release_updates probe
          --line "${ENGINE_LINE}" --version "${ENGINE_VERSION}" --arch "${ENGINE_ARCH}"
          --output "${RUNNER_TEMP}/release-evidence/${ENGINE_LINE}/${ENGINE_ARCH}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-release-${{ matrix.line }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
          retention-days: 7

  propose:
    name: Propose complete Docker Engine updates
    needs: [discover, probe]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-release-plan
          path: ${{ runner.temp }}/release-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-release-*
          path: ${{ runner.temp }}/release-evidence
          merge-multiple: true
      - name: Open update PRs and enable patch auto-merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::Set RELEASE_AUTOMATION_TOKEN to a repository-scoped bot/App token with Contents, Pull requests and Issues write permission. GitHub's built-in token cannot enter the merge queue."
            exit 1
          fi
          uv run --frozen --python "${PYTHON_VERSION}" python -m scripts.release_pull_requests \
            --plan "${RUNNER_TEMP}/release-plan/release-plan.json" \
            --evidence-dir "${RUNNER_TEMP}/release-evidence"
