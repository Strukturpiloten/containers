# Generated by `python -m scripts.container_engine generate-workflow`.
name: Documentation site

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
      - "documentation/**"
      - "images/**/README.md"
      - "images/**/docs/**"
      - "shared/**/README.md"
      - "shared/**/docs/**"
      - "scripts/documentation.py"
      - "scripts/docs_catalogue.py"
      - "scripts/docs_observations.py"
      - "scripts/docs_site.py"
      - ".github/workflow-templates/documentation.yml.j2"
      - ".github/workflows/documentation.yml"
      - "tests/test_documentation.py"
      - "tests/test_docs_catalogue.py"
      - "tests/test_docs_observations.py"
      - "tests/test_docs_site.py"
      - "tests/test_documentation_workflow.py"
  workflow_run:
    workflows:
      - Publish images
    types:
      - completed
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  group: documentation-pages
  cancel-in-progress: false

permissions: {}

env:
  PYTHON_VERSION: "3.14"
  UV_VERSION: 0.12.19

jobs:
  gate:
    name: Check trusted site refresh
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main') ||
      (github.event_name == 'workflow_run' &&
      github.event.repository.default_branch == 'main' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/publish-images.yml' &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.event == 'workflow_dispatch') &&
      (github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      refresh: ${{ steps.scope.outputs.refresh }}
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Wait for publication when a push also changes image inputs
        id: scope
        shell: bash
        env:
          BEFORE: ${{ github.event.before || '' }}
          PUBLISHED_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == workflow_run ]]; then
            if [[ -z "${PUBLISHED_SHA}" ]] || ! git merge-base --is-ancestor "${PUBLISHED_SHA}" HEAD; then
              echo 'Publishing run commit is no longer an ancestor of main; skipping stale refresh.' >> "${GITHUB_STEP_SUMMARY}"
              echo 'refresh=false' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          if [[ "${GITHUB_EVENT_NAME}" != push ]]; then
            echo 'refresh=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo 'Push base is unavailable; refresh after publication or dispatch manually.' >> "${GITHUB_STEP_SUMMARY}"
            echo 'refresh=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! git diff --no-renames --name-only "${BEFORE}" "${GITHUB_SHA}" > "${RUNNER_TEMP}/changed-files"; then
            echo 'Push diff is unavailable; refresh after publication or dispatch manually.' >> "${GITHUB_STEP_SUMMARY}"
            echo 'refresh=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          while IFS= read -r changed; do
            case "${changed}" in
              README.md|CONTRIBUTING.md|SECURITY.md|docs/*|documentation/*|\
              images/*/README.md|images/*/docs/*|shared/*/README.md|shared/*/docs/*|\
              scripts/documentation.py|scripts/docs_catalogue.py|scripts/docs_observations.py|scripts/docs_site.py|\
              .github/workflow-templates/documentation.yml.j2|.github/workflows/documentation.yml|\
              tests/test_documentation.py|tests/test_docs_catalogue.py|tests/test_docs_observations.py|\
              tests/test_docs_site.py|tests/test_documentation_workflow.py)
                ;;
              *)
                echo "Push includes ${changed}; waiting for Publish images completion." >> "${GITHUB_STEP_SUMMARY}"
                echo 'refresh=false' >> "${GITHUB_OUTPUT}"
                exit 0
                ;;
            esac
          done < "${RUNNER_TEMP}/changed-files"
          echo 'refresh=true' >> "${GITHUB_OUTPUT}"

  build:
    name: Build site with registry snapshot
    needs: gate
    if: needs.gate.outputs.refresh == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
          submodules: true
      - name: Install uv
        uses: ./.github/actions/setup-uv
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install registry inspection tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Refresh verified registry snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          previous="${RUNNER_TEMP}/previous-registry-snapshot.json"
          arguments=()
          if curl --fail --location --silent --show-error --retry 2 --max-time 20 \
            'https://containers.strukturpiloten.de/data/registry-snapshot.json' --output "${previous}"; then
            arguments+=(--previous "${previous}")
          else
            rm -f -- "${previous}"
            echo 'Previous published snapshot was unavailable; registry refresh will record current observations only.' >> "${GITHUB_STEP_SUMMARY}"
          fi
          uv run --frozen --python "${PYTHON_VERSION}" python -m scripts.docs_observations \
            --repository Strukturpiloten/containers --output "${RUNNER_TEMP}/registry-snapshot.json" \
            "${arguments[@]}"
      - name: Build strict documentation site
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --group docs --python "${PYTHON_VERSION}" python -m scripts.documentation \
            --output _site --snapshot "${RUNNER_TEMP}/registry-snapshot.json"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    name: Deploy documentation site
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
