# Generated by `python -m scripts.container_engine generate-workflow`.
name: Complete Renovate updates

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch:
    inputs:
      pull_request:
        description: "PR number; leave empty to reconcile all open Renovate PRs"
        required: false
        type: string

concurrency:
  group: renovate-generated-files-${{ github.event.pull_request.number || inputs.pull_request || 'sweep' }}
  cancel-in-progress: false

permissions: {}

env:
  PYTHON_VERSION: "3.14.10"
  UV_VERSION: 0.13.6

jobs:
  complete:
    name: Complete generated dependency files
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.user.login == 'renovate[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: ./.github/actions/setup-uv
        with:
          version: ${{ env.UV_VERSION }}
      - name: Complete generated Renovate files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::RELEASE_AUTOMATION_TOKEN is required to push completion commits and trigger PR CI."
            exit 1
          fi
          arguments=()
          if [ -n "${PR_NUMBER}" ]; then
            [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || exit 1
            arguments+=(--pull-request "${PR_NUMBER}")
          fi
          uv run --frozen --python "${PYTHON_VERSION}" python -m scripts.renovate_updates "${arguments[@]}"
