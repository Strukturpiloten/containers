name: Finalize image release
description: Create an automatic GitHub Release and promote verified SemVer image tags.

inputs:
  default-branch:
    description: Repository default branch.
    required: true
  entry:
    description: JSON matrix entry with image name.
    required: true
  github-token:
    description: Short-lived token used for GitHub Release and registry access.
    required: true

runs:
  using: composite
  steps:
    - name: Install OCI tooling
      shell: bash
      run: |
        set -euo pipefail

        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends skopeo

    - name: Download published image result
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ fromJSON(inputs.entry).name }}-build-result
        path: ${{ runner.temp }}/image-result

    - name: Install uv
      uses: ./.github/actions/setup-uv
      with:
        version: ${{ env.UV_VERSION }}

    - name: Log in to GitHub Container Registry
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        printf '%s' "${GITHUB_TOKEN}" | skopeo login --username "${GITHUB_ACTOR}" --password-stdin ghcr.io

    - name: Finalize metadata-driven release
      id: release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        IMAGE_NAME: ${{ fromJSON(inputs.entry).name }}
      run: |
        set -euo pipefail

        uv run --frozen --python "${PYTHON_VERSION}" python -m scripts.container_engine finalize-release \
          --image "${IMAGE_NAME}" \
          --build-result "${RUNNER_TEMP}/image-result/${IMAGE_NAME}-build-result.json" \
          --default-branch "${{ inputs.default-branch }}"

    - name: Upload finalized release result
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.release.outputs.image_name }}-release-result
        path: ${{ runner.temp }}/image-result/${{ steps.release.outputs.image_name }}-build-result.json
        if-no-files-found: error
        retention-days: 30
