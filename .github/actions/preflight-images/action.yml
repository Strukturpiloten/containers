name: Preflight selected image inputs
description: Verify pinned external manifests and Linux architectures before starting builds.

inputs:
  plan:
    description: Path to the selected build plan.
    default: build-plan.json
  output:
    description: Path for preflight evidence, including failures.
    default: image-inputs.json

runs:
  using: composite
  steps:
    - name: Install registry inspection tool
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get -o Acquire::Retries=3 update
        sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends skopeo
    - name: Verify selected manifests
      shell: bash
      env:
        INPUT_PLAN: ${{ inputs.plan }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        uv run --frozen --python "${PYTHON_VERSION}" python -m scripts.image_inputs \
          --plan "${INPUT_PLAN}" --output "${INPUT_OUTPUT}"
