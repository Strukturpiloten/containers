name: Publish image
description: Publish one multi-architecture image manifest, sign it, attest it, and upload build metadata.

inputs:
  default-branch:
    description: Repository default branch.
    required: true
  entry:
    description: JSON matrix entry with image name.
    required: true
  github-token:
    description: Short-lived token used for registry and SBOM authentication.
    required: true
  syft-version:
    description: Syft version to install.
    required: true
runs:
  using: composite
  steps:
    - name: Install OCI tooling
      shell: bash
      run: |
        set -euo pipefail

        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends podman skopeo

    - name: Download build plan
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: container-build-plan
        path: ${{ runner.temp }}/container-build-plan

    - name: Install uv
      uses: ./.github/actions/setup-uv
      with:
        version: ${{ env.UV_VERSION }}

    - name: Download architecture image archives
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: ${{ fromJSON(inputs.entry).name }}-*-oci-archive
        path: ${{ runner.temp }}/oci-archives
        merge-multiple: true

    - name: Download native runtime evidence
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: ${{ fromJSON(inputs.entry).name }}-*-runtime-evidence
        path: ${{ runner.temp }}/runtime-evidence
        merge-multiple: true

    - name: Download vulnerability reports
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: ${{ fromJSON(inputs.entry).name }}-*-vulnerability-report
        path: ${{ runner.temp }}/scan-reports
        merge-multiple: true

    - name: Require matching runtime and scan evidence
      shell: bash
      env:
        IMAGE_NAME: ${{ fromJSON(inputs.entry).name }}
      run: |
        set -euo pipefail

        uv run --frozen --python "${PYTHON_VERSION}" python -m scripts.evidence_gate \
          --name "$IMAGE_NAME" \
          --plan "${RUNNER_TEMP}/container-build-plan/build-plan.json" \
          --archives-dir "${RUNNER_TEMP}/oci-archives" \
          --runtime-dir "${RUNNER_TEMP}/runtime-evidence" \
          --scan-dir "${RUNNER_TEMP}/scan-reports"

    - name: Install Syft
      uses: ./.github/actions/setup-syft
      with:
        version: ${{ inputs.syft-version }}

    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3

    - name: Log in to GitHub Container Registry
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        printf '%s' "${GITHUB_TOKEN}" | sudo podman login --username "${GITHUB_ACTOR}" --password-stdin ghcr.io

    - name: Publish image
      id: publish
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        mkdir -p "${RUNNER_TEMP}/image-results"
        uv run --frozen --python "${PYTHON_VERSION}" python -m scripts.container_engine publish-image \
          --plan "${RUNNER_TEMP}/container-build-plan/build-plan.json" \
          --entry-json '${{ inputs.entry }}' \
          --archives-dir "${RUNNER_TEMP}/oci-archives" \
          --output-dir "${RUNNER_TEMP}/image-results" \
          --default-branch "${{ inputs.default-branch }}"

    - name: Attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-digest: ${{ steps.publish.outputs.index_digest }}
        subject-name: ${{ steps.publish.outputs.image }}
        push-to-registry: true

    - name: Attest amd64 SBOM
      if: steps.publish.outputs.amd64_digest != ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-digest: ${{ steps.publish.outputs.amd64_digest }}
        subject-name: ${{ steps.publish.outputs.image }}
        sbom-path: ${{ steps.publish.outputs.sbom_amd64 }}
        push-to-registry: true
        create-storage-record: false

    - name: Attest arm64 SBOM
      if: steps.publish.outputs.arm64_digest != ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-digest: ${{ steps.publish.outputs.arm64_digest }}
        subject-name: ${{ steps.publish.outputs.image }}
        sbom-path: ${{ steps.publish.outputs.sbom_arm64 }}
        push-to-registry: true
        create-storage-record: false

    - name: Promote verified image tags
      shell: bash
      run: |
        set -euo pipefail

        uv run --frozen --python "${PYTHON_VERSION}" python -m scripts.container_engine promote-image \
          --image "${{ steps.publish.outputs.image }}" \
          --digest "${{ steps.publish.outputs.index_digest }}" \
          --build-result "${{ steps.publish.outputs.build_result }}" \
          --default-branch "${{ inputs.default-branch }}"

    - name: Upload build result
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.publish.outputs.image_name }}-build-result
        path: ${{ steps.publish.outputs.build_result }}
        if-no-files-found: error
        retention-days: 30
