# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: typo3-phpfpm
version: v2.0.0
image: ghcr.io/strukturpiloten/typo3-phpfpm
title: TYPO3 PHP-FPM
description: TYPO3 PHP-FPM runtime image with TYPO3 extensions and container utilities

build:
  context: .
  containerfile: images/typo3/typo3-phpfpm/Containerfile
  architectures:
    - amd64
    - arm64
  runtimeBaseArg: BASE_IMAGE
  args:
    BASE_IMAGE:
      value: docker.io/php:8.5.7-fpm-alpine3.22@sha256:95588bfaf1b890e3fc1f308a0a23539c4f03ce28a4fc770473ae3899d6669777
      type: external-image
    PHP_EXTENSION_INSTALLER_IMAGE:
      value: ghcr.io/mlocati/php-extension-installer:2.11.12@sha256:b6d3fa381b9ba5cf051117c1c601d6a523b590e534bf3d56eb4fbe352949c138
      type: external-image
    PODMAN_TYPO3_DATA_DIR_CONTAINER:
      value: /var/www/typo3
      type: static

dependencies:
  internal: []
  external:
    - name: php
      image: docker.io/php
      arg: BASE_IMAGE
    - name: php-extension-installer
      image: ghcr.io/mlocati/php-extension-installer
      arg: PHP_EXTENSION_INSTALLER_IMAGE

inputs:
  - images/typo3/typo3-phpfpm/**
  - shared/container-utilities/**
  - shared/oci-labels.env
