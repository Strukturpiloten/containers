# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: typo3-phpfpm
version: v2.0.0
image: ghcr.io/strukturpiloten/typo3-phpfpm
title: TYPO3 PHP-FPM
description: TYPO3 PHP-FPM runtime image with TYPO3 extensions and container utilities

tests:
  phpFpm:
    extensions: [apcu, exif, gd, gmp, imagick, intl, pcntl, pdo_mysql, pdo_pgsql, pgsql, redis, sodium, sysvsem, zip]

lifecycle:
  state: maintained
  admission: production
  reviewAfter: "2026-12-31"
  supportBoundary: "Repository maintains pinned application inputs and base images; upstream component support requires separate review."
  requiredRuntimeProfiles:
    - phpFpm

build:
  context: .
  containerfile: images/typo3/typo3-phpfpm/Containerfile
  architectures:
    - amd64
    - arm64
  runtimeBaseArg: BASE_IMAGE
  args:
    BASE_IMAGE:
      value: docker.io/php:8.5.12-fpm-alpine3.24@sha256:4c2818074ec49f6abe46620f3965e0cb75bc3a5f2b417edd1aacaba6f091c40e
      type: external-image
    COMPOSER_VERSION:
      value: 2.10.3
      type: static
    PHP_APCU_VERSION:
      value: 5.1.28
      type: static
    PHP_IMAGICK_VERSION:
      value: 3.8.1
      type: static
    PHP_REDIS_VERSION:
      value: 6.3.0
      type: static
    PHP_EXTENSION_INSTALLER_IMAGE:
      value: ghcr.io/mlocati/php-extension-installer:2.12.6@sha256:e772f8d2c1b88ab5872611b400410b4ab1839a6a0ff5ce460eb2105a35d62953
      type: external-image
    PODMAN_TYPO3_DATA_DIR_CONTAINER:
      value: /var/www/typo3
      type: static

dependencies:
  internal: []
  external:
    - name: php
      image: docker.io/php
      arg: BASE_IMAGE
    - name: php-extension-installer
      image: ghcr.io/mlocati/php-extension-installer
      arg: PHP_EXTENSION_INSTALLER_IMAGE

inputs:
  - images/typo3/typo3-phpfpm/**
  - shared/container-utilities/**
  - shared/oci-labels.env
