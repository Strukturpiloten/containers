# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: nextcloud-phpfpm
version: v1.0.0
image: ghcr.io/strukturpiloten/nextcloud-phpfpm
title: Nextcloud PHP-FPM
description: Nextcloud PHP-FPM runtime image with PHP extensions, ffmpeg and container utilities

tests:
  phpFpm:
    extensions: [apcu, exif, gd, gmp, imagick, intl, pcntl, pdo_mysql, pdo_pgsql, pgsql, redis, sodium, sysvsem, zip]

lifecycle:
  state: maintained
  admission: production
  reviewAfter: "2026-12-31"
  supportBoundary: "Repository maintains pinned application inputs and base images; upstream component support requires separate review."
  requiredRuntimeProfiles:
    - phpFpm

build:
  context: .
  containerfile: images/nextcloud/nextcloud-phpfpm/Containerfile
  architectures:
    - amd64
    - arm64
  runtimeBaseArg: BASE_IMAGE
  args:
    BASE_IMAGE:
      value: docker.io/php:8.5.12-fpm-alpine3.24@sha256:64535609509e0fd5c8529359e6b599a68ce42089defd565f7881efdae7687cea
      type: external-image
    COMPOSER_VERSION:
      value: 2.11.1
      type: static
    PHP_APCU_VERSION:
      value: 5.1.28
      type: static
    PHP_IMAGICK_VERSION:
      value: 3.8.1
      type: static
    PHP_REDIS_VERSION:
      value: 6.3.0
      type: static
    PHP_EXTENSION_INSTALLER_IMAGE:
      value: ghcr.io/mlocati/php-extension-installer:2.13.2@sha256:4fd45396c16685266d32bf147a24ecd5e81029d3820295895bf4a90131190ac9
      type: external-image
    PODMAN_NEXTCLOUD_DATA_DIR_CONTAINER:
      value: /var/www/nextcloud
      type: static

dependencies:
  internal: []
  external:
    - name: php
      image: docker.io/php
      arg: BASE_IMAGE
    - name: php-extension-installer
      image: ghcr.io/mlocati/php-extension-installer
      arg: PHP_EXTENSION_INSTALLER_IMAGE

inputs:
  - images/nextcloud/nextcloud-phpfpm/**
  - shared/container-utilities/**
  - shared/oci-labels.env
