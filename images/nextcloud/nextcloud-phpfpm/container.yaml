# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: nextcloud-phpfpm
version: v1.0.0
image: ghcr.io/strukturpiloten/nextcloud-phpfpm
title: Nextcloud PHP-FPM
description: Nextcloud PHP-FPM runtime image with PHP extensions, ffmpeg and container utilities

build:
  context: .
  containerfile: images/nextcloud/nextcloud-phpfpm/Containerfile
  architectures:
    - amd64
    - arm64
  runtimeBaseArg: BASE_IMAGE
  args:
    BASE_IMAGE:
      value: docker.io/php:8.5.10-fpm-alpine3.24@sha256:22a4c414bb8e91ac7aefe9b1d80e832caa67252aca58b6af7eeb3bc92188fc5b
      type: external-image
    PHP_EXTENSION_INSTALLER_IMAGE:
      value: ghcr.io/mlocati/php-extension-installer:2.11.27@sha256:38772e61ab498b8acaed7dea4042fe82fafffd741114819687c1cdfd4ecfd0bb
      type: external-image
    PODMAN_NEXTCLOUD_DATA_DIR_CONTAINER:
      value: /var/www/nextcloud
      type: static

dependencies:
  internal: []
  external:
    - name: php
      image: docker.io/php
      arg: BASE_IMAGE
    - name: php-extension-installer
      image: ghcr.io/mlocati/php-extension-installer
      arg: PHP_EXTENSION_INSTALLER_IMAGE

inputs:
  - images/nextcloud/nextcloud-phpfpm/**
  - shared/container-utilities/**
  - shared/oci-labels.env
