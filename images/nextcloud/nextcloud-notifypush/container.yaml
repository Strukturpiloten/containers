# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: nextcloud-notifypush
version: v1.0.0
image: ghcr.io/strukturpiloten/nextcloud-notifypush
title: Nextcloud notify_push
description: Nextcloud notify_push binary built from source with a minimal Alpine runtime

build:
  context: .
  containerfile: images/nextcloud/nextcloud-notifypush/Containerfile
  architectures:
    - amd64
    - arm64
  runtimeBaseArg: RUNTIME_IMAGE
  args:
    BASE_IMAGE:
      value: docker.io/rust:1.98.1-alpine3.23@sha256:737ba17e6a2ffe14475b59861cd69f3d7152c29c75140bdbf6750befcfda7e6c
      type: external-image
    RUNTIME_IMAGE:
      value: docker.io/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
      type: external-image
    NOTIFYPUSH_REPOSITORY:
      value: https://github.com/nextcloud/notify_push.git
      type: static
    NOTIFYPUSH_VERSION:
      value: v1.4.0
      type: static

dependencies:
  internal: []
  external:
    - name: rust
      image: docker.io/rust
      arg: BASE_IMAGE
    - name: alpine
      image: docker.io/alpine
      arg: RUNTIME_IMAGE

inputs:
  - images/nextcloud/nextcloud-notifypush/**
  - shared/oci-labels.env
