# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: nextcloud-notifypush
version: v1.0.0
image: ghcr.io/strukturpiloten/nextcloud-notifypush
title: Nextcloud notify_push
description: Nextcloud notify_push binary built from source with a minimal Alpine runtime

tests:
  notifyPush: {}

lifecycle:
  state: maintained
  admission: production
  reviewAfter: "2026-12-31"
  supportBoundary: "Repository maintains pinned application inputs and base images; upstream component support requires separate review."
  requiredRuntimeProfiles:
    - notifyPush

build:
  context: .
  containerfile: images/nextcloud/nextcloud-notifypush/Containerfile
  architectures:
    - amd64
    - arm64
  runtimeBaseArg: RUNTIME_IMAGE
  args:
    BASE_IMAGE:
      value: docker.io/rust:1.99.1-alpine3.23@sha256:51e1b72c7f236093c084f6e3051239f033fba9e4c0c1430cc2ed479d0a3bd14c
      type: external-image
    RUNTIME_IMAGE:
      value: docker.io/alpine:3.24.4@sha256:93b41ef40b1677fce8fcc64ff4af09daddfacf5040afde618bc46c1e2d1cc7d4
      type: external-image
    NOTIFYPUSH_REPOSITORY:
      value: https://github.com/nextcloud/notify_push.git
      type: static
    NOTIFYPUSH_VERSION:
      value: v1.4.2
      type: static
    NOTIFYPUSH_COMMIT:
      value: e393d172087e872fa88dc87baa39e6eb1bbde496
      type: static

dependencies:
  internal: []
  external:
    - name: rust
      image: docker.io/rust
      arg: BASE_IMAGE
    - name: alpine
      image: docker.io/alpine
      arg: RUNTIME_IMAGE

inputs:
  - images/nextcloud/nextcloud-notifypush/**
  - shared/oci-labels.env
