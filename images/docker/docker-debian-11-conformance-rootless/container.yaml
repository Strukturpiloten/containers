---
# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: docker-debian-11-conformance-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/docker-debian-11-conformance-rootless
title: Docker Debian 11 systemd conformance rootless
description: Exact Debian 11 docker.io package with rootless guest-systemd conformance for isolated compatibility tests
tests:
  docker:
    mode: rootless
    launcher: systemd
    outerPrivilege: privileged
    nestedRuntime: true
build:
  context: .
  containerfile: images/docker/conformance/debian.Containerfile
  architectures:
    - amd64
    - arm64
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9
      type: external-image
    DISTRO_ID:
      value: 'debian-11'
      type: static
    ENGINE_PACKAGE:
      value: 'docker.io'
      type: static
    ENGINE_PACKAGE_VERSION:
      value: '20.10.5+dfsg1-1+deb11u2'
      type: static
    ENGINE_VERSION:
      value: '20.10.5+dfsg1'
      type: static
    MODE:
      value: 'rootless'
      type: static
    DOCKER_HOST_VALUE:
      value: 'unix:///run/user/1000/docker.sock'
      type: static
    STORAGE_PATH:
      value: '/home/docker/.local/share/docker'
      type: static
dependencies:
  internal: []
  external:
    - name: debian-11
      image: docker.io/library/debian
      arg: DISTRO_IMAGE
inputs:
  - images/docker/docker-debian-11-conformance-rootless/**
  - images/docker/conformance/**
  - images/docker/platforms/install-packages.sh
  - scripts/docker_userns_active.py
  - scripts/docker_userns_active_client.py
  - scripts/docker_userns_active_bootstrap_bundle.py
  - scripts/docker_userns_bootstrap_bundle.py
  - scripts/docker_userns_qualification.py
  - .github/docker-userns-active-admission.json
  - .github/docker-userns-active-helper-closure.json
  - scripts/__init__.py
  - scripts/docker_runner_security.py
  - scripts/docker_userns_custody_child.py
  - scripts/docker_userns_policy_source.py
  - scripts/docker_userns_custody.py
  - scripts/docker_userns_hosted.py
  - scripts/docker_userns_dryparse.py
  - .github/docker-userns-policy-source.json
  - scripts/runtime_docker_systemd.py
  - scripts/runtime_docker_systemd_guard.py
  - scripts/runtime_oom_diagnostics.py
  - scripts/runtime_oom_watch.py
  - shared/oci-labels.env
lifecycle:
  state: legacy
  admission: isolated-test
  reviewAfter: '2026-10-31'
  supportBoundary: >-
    Debian 11 is past LTS. Exact archived docker.io 20.10.5+dfsg1-1+deb11u2 is a manually reviewed fixed compatibility input; signed archive Main and security retain package authentication. Native conformance remains unqualified.
    Engine 20.10.5 predates Moby's rootless OOM-score fix and requires an outer OOM score of zero for nested work.
    Dedicated privileged isolated conformance fixture; guest systemd requires verified private cgroup-v2 delegation and backend-specific exec placement.
    Devices remain subject to native Engine/runc behavior and are not repaired by this profile.
  requiredRuntimeProfiles:
    - docker
