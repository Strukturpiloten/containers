# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: docker-ubuntu-26.04-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/docker-ubuntu-26.04-rootless
title: Docker Engine Ubuntu 26.04 rootless
description: Native Ubuntu 26.04 docker.io package with rootless Docker daemon for isolated compatibility tests
tests:
  docker:
    mode: rootless
    outerPrivilege: privileged
    nestedRuntime: true
build:
  context: .
  containerfile: images/docker/platforms/Containerfile
  architectures:
  - amd64
  - arm64
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
      type: external-image
    DISTRO_ID:
      value: ubuntu-26.04
      type: static
    ENGINE_PACKAGE:
      value: docker.io
      type: static
    RUN_AS_USER:
      value: 1000:1000
      type: static
    HOME_DIR:
      value: /home/docker
      type: static
    RUNTIME_DIR:
      value: /run/user/1000
      type: static
    DOCKER_HOST_VALUE:
      value: unix:///run/user/1000/docker.sock
      type: static
    STORAGE_PATH:
      value: /home/docker/.local/share/docker
      type: static
dependencies:
  internal: []
  external:
  - name: ubuntu-26.04
    image: docker.io/library/ubuntu
    arg: DISTRO_IMAGE
inputs:
- images/docker/docker-ubuntu-26.04-rootless/**
- images/docker/platforms/Containerfile
- images/docker/platforms/install-packages.sh
- images/docker/platforms/start-distro.sh
- shared/oci-labels.env
lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: '2026-10-27'
  supportBoundary: Vendor package revisions can advance with repository updates; image shares runner kernel and host security
    policy.
  requiredRuntimeProfiles:
  - docker
