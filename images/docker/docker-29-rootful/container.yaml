# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: docker-29-rootful
version: v29.9.2
image: ghcr.io/strukturpiloten/docker-29-rootful
title: Docker Engine 29 rootful
description: Upstream Docker Engine 29.9.2 static payload on maintained Alpine, rootful daemon
tests:
  docker:
    mode: rootful
    outerPrivilege: privileged
    nestedRuntime: true
build:
  context: .
  containerfile: images/docker/upstream/rootful.Containerfile
  architectures:
  - amd64
  - arm64
  runtimeBaseArg: ALPINE_IMAGE
  payload: images/docker/upstream/29/payload.yaml
  args:
    ALPINE_IMAGE:
      value: docker.io/library/alpine:3.24@sha256:3f4d6b32e26703c6082839234f43769d5046b3ac7c910033911d1e71d8cd630a
      type: external-image
dependencies:
  internal: []
  external:
  - name: alpine
    image: docker.io/library/alpine
    arg: ALPINE_IMAGE
inputs:
- images/docker/docker-29-rootful/**
- images/docker/upstream/29/payload.yaml
- images/docker/upstream/payload.Containerfile
- images/docker/upstream/fetch-payload.sh
- images/docker/upstream/rootful.Containerfile
- images/docker/upstream/start-rootful.sh
- shared/oci-labels.env
lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: '2026-10-27'
  supportBoundary: Selected current Engine remains subject to upstream and security review.
  requiredRuntimeProfiles:
  - docker
