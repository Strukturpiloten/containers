# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: docker-debian-11-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/docker-debian-11-rootful
title: Docker Engine Debian 11 rootful
description: Native Debian 11 docker.io package with rootful Docker daemon for isolated compatibility tests
tests:
  docker:
    mode: rootful
    outerPrivilege: privileged
    nestedRuntime: true
build:
  context: .
  containerfile: images/docker/platforms/Containerfile
  architectures:
  - amd64
  - arm64
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9
      type: external-image
    DISTRO_ID:
      value: debian-11
      type: static
    ENGINE_PACKAGE:
      value: docker.io
      type: static
    RUN_AS_USER:
      value: root
      type: static
    HOME_DIR:
      value: /root
      type: static
    RUNTIME_DIR:
      value: /run
      type: static
    DOCKER_HOST_VALUE:
      value: unix:///var/run/docker.sock
      type: static
    STORAGE_PATH:
      value: /var/lib/docker
      type: static
dependencies:
  internal: []
  external:
  - name: debian-11
    image: docker.io/library/debian
    arg: DISTRO_IMAGE
inputs:
- images/docker/docker-debian-11-rootful/**
- images/docker/platforms/Containerfile
- images/docker/platforms/install-packages.sh
- images/docker/platforms/start-distro.sh
- shared/oci-labels.env
lifecycle:
  state: legacy
  admission: isolated-test
  reviewAfter: '2026-10-27'
  supportBoundary: Debian 11 is past LTS; signed archived main currently installs an older historical Docker revision. Isolated
    compatibility fixture only.
  requiredRuntimeProfiles:
  - docker
