# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: docker-27-rootless
version: v27.5.1
image: ghcr.io/strukturpiloten/docker-27-rootless
title: Docker Engine 27 rootless
description: Upstream Docker Engine 27.5.1 static payload on maintained Alpine, rootless daemon
tests:
  docker:
    mode: rootless
    outerPrivilege: privileged
    nestedRuntime: true
build:
  context: .
  containerfile: images/docker/upstream/rootless.Containerfile
  architectures:
  - amd64
  - arm64
  runtimeBaseArg: ALPINE_IMAGE
  payload: images/docker/upstream/27/payload.yaml
  args:
    ALPINE_IMAGE:
      value: docker.io/library/alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
      type: external-image
dependencies:
  internal: []
  external:
  - name: alpine
    image: docker.io/library/alpine
    arg: ALPINE_IMAGE
inputs:
- images/docker/docker-27-rootless/**
- images/docker/upstream/27/payload.yaml
- images/docker/upstream/payload.Containerfile
- images/docker/upstream/fetch-payload.sh
- images/docker/upstream/rootless.Containerfile
- images/docker/upstream/start-rootless.sh
- shared/oci-labels.env
lifecycle:
  state: legacy
  admission: isolated-test
  reviewAfter: '2026-10-27'
  supportBoundary: Pinned static Engine and bundled dependencies are not patched by Alpine OS rebuilds; isolated compatibility
    fixture only.
  requiredRuntimeProfiles:
  - docker
