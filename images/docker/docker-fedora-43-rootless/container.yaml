# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: docker-fedora-43-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/docker-fedora-43-rootless
title: Docker Engine Fedora 43 rootless
description: Native Fedora 43 moby-engine package with rootless Docker daemon for isolated compatibility tests
tests:
  docker:
    mode: rootless
    outerPrivilege: privileged
    nestedRuntime: true
build:
  context: .
  containerfile: images/docker/platforms/Containerfile
  architectures:
  - amd64
  - arm64
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.fedoraproject.org/fedora:43@sha256:012a9df5c3ee0e6ec8027ca5d1d546d449acfd9cf73ddf11c896c4cda1039310
      type: external-image
    DISTRO_ID:
      value: fedora-43
      type: static
    ENGINE_PACKAGE:
      value: moby-engine
      type: static
    RUN_AS_USER:
      value: 1000:1000
      type: static
    HOME_DIR:
      value: /home/docker
      type: static
    RUNTIME_DIR:
      value: /run/user/1000
      type: static
    DOCKER_HOST_VALUE:
      value: unix:///run/user/1000/docker.sock
      type: static
    STORAGE_PATH:
      value: /home/docker/.local/share/docker
      type: static
dependencies:
  internal: []
  external:
  - name: fedora-43
    image: registry.fedoraproject.org/fedora
    arg: DISTRO_IMAGE
inputs:
- images/docker/docker-fedora-43-rootless/**
- images/docker/platforms/Containerfile
- images/docker/platforms/install-packages.sh
- images/docker/platforms/start-distro.sh
- shared/oci-labels.env
lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: '2026-10-27'
  supportBoundary: Vendor package revisions can advance with repository updates; image shares runner kernel and host security
    policy.
  requiredRuntimeProfiles:
  - docker
