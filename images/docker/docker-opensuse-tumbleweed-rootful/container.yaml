# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: docker-opensuse-tumbleweed-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/docker-opensuse-tumbleweed-rootful
title: Docker Engine openSUSE Tumbleweed rootful
description: Native openSUSE Tumbleweed docker package with rootful Docker daemon for isolated compatibility tests
tests:
  docker:
    mode: rootful
    outerPrivilege: privileged
    nestedRuntime: true
build:
  context: .
  containerfile: images/docker/platforms/Containerfile
  architectures:
  - amd64
  - arm64
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.opensuse.org/opensuse/tumbleweed:latest@sha256:3906bb6ea95dca6992ec37c360c75403f79331b11670c1972645390f031327a0
      type: external-image
    DISTRO_ID:
      value: opensuse-tumbleweed
      type: static
    ENGINE_PACKAGE:
      value: docker
      type: static
    RUN_AS_USER:
      value: root
      type: static
    HOME_DIR:
      value: /root
      type: static
    RUNTIME_DIR:
      value: /run
      type: static
    DOCKER_HOST_VALUE:
      value: unix:///var/run/docker.sock
      type: static
    STORAGE_PATH:
      value: /var/lib/docker
      type: static
dependencies:
  internal: []
  external:
  - name: opensuse-tumbleweed
    image: registry.opensuse.org/opensuse/tumbleweed
    arg: DISTRO_IMAGE
inputs:
- images/docker/docker-opensuse-tumbleweed-rootful/**
- images/docker/platforms/Containerfile
- images/docker/platforms/install-packages.sh
- images/docker/platforms/start-distro.sh
- shared/oci-labels.env
lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: '2026-10-27'
  supportBoundary: Vendor package revisions can advance with repository updates; image shares runner kernel and host security
    policy.
  requiredRuntimeProfiles:
  - docker
