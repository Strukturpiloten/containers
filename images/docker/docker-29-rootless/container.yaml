# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: docker-29-rootless
version: v29.8.1
image: ghcr.io/strukturpiloten/docker-29-rootless
title: Docker Engine 29 rootless
description: Upstream Docker Engine 29.8.1 static payload on maintained Alpine, rootless daemon
tests:
  docker:
    mode: rootless
    outerPrivilege: privileged
    nestedRuntime: true
build:
  context: .
  containerfile: images/docker/upstream/rootless.Containerfile
  architectures:
  - amd64
  - arm64
  runtimeBaseArg: ALPINE_IMAGE
  payload: images/docker/upstream/29/payload.yaml
  args:
    ALPINE_IMAGE:
      value: docker.io/library/alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
      type: external-image
dependencies:
  internal: []
  external:
  - name: alpine
    image: docker.io/library/alpine
    arg: ALPINE_IMAGE
inputs:
- images/docker/docker-29-rootless/**
- images/docker/upstream/29/payload.yaml
- images/docker/upstream/payload.Containerfile
- images/docker/upstream/fetch-payload.sh
- images/docker/upstream/rootless.Containerfile
- images/docker/upstream/start-rootless.sh
- shared/oci-labels.env
lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: '2026-10-27'
  supportBoundary: Selected current Engine remains subject to upstream and security review.
  requiredRuntimeProfiles:
  - docker
