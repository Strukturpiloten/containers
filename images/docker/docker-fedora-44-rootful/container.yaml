# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: docker-fedora-44-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/docker-fedora-44-rootful
title: Docker Engine Fedora 44 rootful
description: Native Fedora 44 moby-engine package with rootful Docker daemon for isolated compatibility tests
tests:
  docker:
    mode: rootful
    outerPrivilege: privileged
    nestedRuntime: true
build:
  context: .
  containerfile: images/docker/platforms/Containerfile
  architectures:
  - amd64
  - arm64
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.fedoraproject.org/fedora:44@sha256:1ccd18224d9b302fe62d3cefd0a9e0724c365ea8ac3bfb017c569540fe76433a
      type: external-image
    DISTRO_ID:
      value: fedora-44
      type: static
    ENGINE_PACKAGE:
      value: moby-engine
      type: static
    RUN_AS_USER:
      value: root
      type: static
    HOME_DIR:
      value: /root
      type: static
    RUNTIME_DIR:
      value: /run
      type: static
    DOCKER_HOST_VALUE:
      value: unix:///var/run/docker.sock
      type: static
    STORAGE_PATH:
      value: /var/lib/docker
      type: static
dependencies:
  internal: []
  external:
  - name: fedora-44
    image: registry.fedoraproject.org/fedora
    arg: DISTRO_IMAGE
inputs:
- images/docker/docker-fedora-44-rootful/**
- images/docker/platforms/Containerfile
- images/docker/platforms/install-packages.sh
- images/docker/platforms/start-distro.sh
- shared/oci-labels.env
lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: '2026-10-27'
  supportBoundary: Vendor package revisions can advance with repository updates; image shares runner kernel and host security
    policy.
  requiredRuntimeProfiles:
  - docker
