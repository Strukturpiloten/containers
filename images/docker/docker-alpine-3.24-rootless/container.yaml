# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: docker-alpine-3.24-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/docker-alpine-3.24-rootless
title: Docker Engine Alpine 3.24 rootless
description: Native Alpine 3.24 docker package with rootless Docker daemon for isolated compatibility tests
tests:
  docker:
    mode: rootless
    outerPrivilege: privileged
    nestedRuntime: true
build:
  context: .
  containerfile: images/docker/platforms/Containerfile
  architectures:
  - amd64
  - arm64
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
      type: external-image
    DISTRO_ID:
      value: alpine-3.24
      type: static
    ENGINE_PACKAGE:
      value: docker
      type: static
    RUN_AS_USER:
      value: 1000:1000
      type: static
    HOME_DIR:
      value: /home/docker
      type: static
    RUNTIME_DIR:
      value: /run/user/1000
      type: static
    DOCKER_HOST_VALUE:
      value: unix:///run/user/1000/docker.sock
      type: static
    STORAGE_PATH:
      value: /home/docker/.local/share/docker
      type: static
dependencies:
  internal: []
  external:
  - name: alpine-3.24
    image: docker.io/library/alpine
    arg: DISTRO_IMAGE
inputs:
- images/docker/docker-alpine-3.24-rootless/**
- images/docker/platforms/Containerfile
- images/docker/platforms/install-packages.sh
- images/docker/platforms/start-distro.sh
- shared/oci-labels.env
lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: '2026-10-27'
  supportBoundary: Vendor package revisions can advance with repository updates; image shares runner kernel and host security
    policy.
  requiredRuntimeProfiles:
  - docker
