# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: docker-arch-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/docker-arch-rootless
title: Docker Engine Arch Linux rootless
description: Native Arch Linux docker package with rootless Docker daemon for isolated compatibility tests
tests:
  docker:
    mode: rootless
    outerPrivilege: privileged
    nestedRuntime: true
build:
  context: .
  containerfile: images/docker/platforms/Containerfile
  architectures:
  - amd64
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/archlinux:base@sha256:4e77cf2ea5f410e6f8be5abf93ccf17ce2436e87a138c167208356711a405dbd
      type: external-image
    DISTRO_ID:
      value: arch
      type: static
    ENGINE_PACKAGE:
      value: docker
      type: static
    RUN_AS_USER:
      value: 1000:1000
      type: static
    HOME_DIR:
      value: /home/docker
      type: static
    RUNTIME_DIR:
      value: /run/user/1000
      type: static
    DOCKER_HOST_VALUE:
      value: unix:///run/user/1000/docker.sock
      type: static
    STORAGE_PATH:
      value: /home/docker/.local/share/docker
      type: static
dependencies:
  internal: []
  external:
  - name: arch
    image: docker.io/library/archlinux
    arg: DISTRO_IMAGE
inputs:
- images/docker/docker-arch-rootless/**
- images/docker/platforms/Containerfile
- images/docker/platforms/install-packages.sh
- images/docker/platforms/start-distro.sh
- shared/oci-labels.env
lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: '2026-10-27'
  supportBoundary: Vendor package revisions can advance with repository updates; image shares runner kernel and host security
    policy.
  requiredRuntimeProfiles:
  - docker
