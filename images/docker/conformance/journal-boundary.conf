[Service]
# Sockets= is append-only on systemd 247 and has no D-Bus Sockets property.
# The audit socket unit is masked. Native checks prove its inactivity and the
# absence of NETLINK_AUDIT FDs in journald rather than hiding dependency edges.
# Never enable/disable the runner's shared kernel audit subsystem.
CapabilityBoundingSet=~CAP_AUDIT_CONTROL
