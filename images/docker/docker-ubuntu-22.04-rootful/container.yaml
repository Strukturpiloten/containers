# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: docker-ubuntu-22.04-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/docker-ubuntu-22.04-rootful
title: Docker Engine Ubuntu 22.04 rootful
description: Native Ubuntu 22.04 docker.io package with rootful Docker daemon for isolated compatibility tests
tests:
  docker:
    mode: rootful
    outerPrivilege: privileged
    nestedRuntime: true
build:
  context: .
  containerfile: images/docker/platforms/Containerfile
  architectures:
  - amd64
  - arm64
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/ubuntu:22.04@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401
      type: external-image
    DISTRO_ID:
      value: ubuntu-22.04
      type: static
    ENGINE_PACKAGE:
      value: docker.io
      type: static
    RUN_AS_USER:
      value: root
      type: static
    HOME_DIR:
      value: /root
      type: static
    RUNTIME_DIR:
      value: /run
      type: static
    DOCKER_HOST_VALUE:
      value: unix:///var/run/docker.sock
      type: static
    STORAGE_PATH:
      value: /var/lib/docker
      type: static
dependencies:
  internal: []
  external:
  - name: ubuntu-22.04
    image: docker.io/library/ubuntu
    arg: DISTRO_IMAGE
inputs:
- images/docker/docker-ubuntu-22.04-rootful/**
- images/docker/platforms/Containerfile
- images/docker/platforms/install-packages.sh
- images/docker/platforms/start-distro.sh
- shared/oci-labels.env
lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: '2026-10-27'
  supportBoundary: Vendor package revisions can advance with repository updates; image shares runner kernel and host security
    policy.
  requiredRuntimeProfiles:
  - docker
