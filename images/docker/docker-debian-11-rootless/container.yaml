# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: docker-debian-11-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/docker-debian-11-rootless
title: Docker Engine Debian 11 rootless
description: Native Debian 11 docker.io package with rootless Docker daemon for isolated compatibility tests
tests:
  docker:
    mode: rootless
    outerPrivilege: privileged
    nestedRuntime: true
build:
  context: .
  containerfile: images/docker/platforms/Containerfile
  architectures:
  - amd64
  - arm64
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9
      type: external-image
    DISTRO_ID:
      value: debian-11
      type: static
    ENGINE_PACKAGE:
      value: docker.io
      type: static
    RUN_AS_USER:
      value: 1000:1000
      type: static
    HOME_DIR:
      value: /home/docker
      type: static
    RUNTIME_DIR:
      value: /run/user/1000
      type: static
    DOCKER_HOST_VALUE:
      value: unix:///run/user/1000/docker.sock
      type: static
    STORAGE_PATH:
      value: /home/docker/.local/share/docker
      type: static
dependencies:
  internal: []
  external:
  - name: debian-11
    image: docker.io/library/debian
    arg: DISTRO_IMAGE
inputs:
- images/docker/docker-debian-11-rootless/**
- images/docker/platforms/Containerfile
- images/docker/platforms/install-packages.sh
- images/docker/platforms/start-distro.sh
- shared/oci-labels.env
lifecycle:
  state: legacy
  admission: isolated-test
  reviewAfter: '2026-10-27'
  supportBoundary: >-
    Debian 11 is past LTS; signed archived main installs historical Docker 20.10.5.
    Its rootless daemon needs an outer workload OOM score of zero for nested containers
    because it predates Moby's rootful-in-rootless OOM fix (moby/moby#46563 and #46626).
    This is an isolated compatibility fixture.
  requiredRuntimeProfiles:
  - docker
