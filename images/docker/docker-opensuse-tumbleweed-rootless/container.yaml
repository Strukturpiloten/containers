# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: docker-opensuse-tumbleweed-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/docker-opensuse-tumbleweed-rootless
title: Docker Engine openSUSE Tumbleweed rootless
description: Native openSUSE Tumbleweed docker package with rootless Docker daemon for isolated compatibility tests
tests:
  docker:
    mode: rootless
    outerPrivilege: privileged
    nestedRuntime: true
build:
  context: .
  containerfile: images/docker/platforms/Containerfile
  architectures:
  - amd64
  - arm64
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.opensuse.org/opensuse/tumbleweed:latest@sha256:15061140c7a863f1b6515d6cf2358b7c11ce3f6d9a0160b22f7afeb456e8cb67
      type: external-image
    DISTRO_ID:
      value: opensuse-tumbleweed
      type: static
    ENGINE_PACKAGE:
      value: docker
      type: static
    RUN_AS_USER:
      value: 1000:1000
      type: static
    HOME_DIR:
      value: /home/docker
      type: static
    RUNTIME_DIR:
      value: /run/user/1000
      type: static
    DOCKER_HOST_VALUE:
      value: unix:///run/user/1000/docker.sock
      type: static
    STORAGE_PATH:
      value: /home/docker/.local/share/docker
      type: static
dependencies:
  internal: []
  external:
  - name: opensuse-tumbleweed
    image: registry.opensuse.org/opensuse/tumbleweed
    arg: DISTRO_IMAGE
inputs:
- images/docker/docker-opensuse-tumbleweed-rootless/**
- images/docker/platforms/Containerfile
- images/docker/platforms/install-packages.sh
- images/docker/platforms/start-distro.sh
- shared/oci-labels.env
lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: '2026-10-27'
  supportBoundary: Vendor package revisions can advance with repository updates; image shares runner kernel and host security
    policy.
  requiredRuntimeProfiles:
  - docker
