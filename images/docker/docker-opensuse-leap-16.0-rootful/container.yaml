# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: docker-opensuse-leap-16.0-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/docker-opensuse-leap-16.0-rootful
title: Docker Engine openSUSE Leap 16.0 rootful
description: Native openSUSE Leap 16.0 docker package with rootful Docker daemon for isolated compatibility tests
tests:
  docker:
    mode: rootful
    outerPrivilege: privileged
    nestedRuntime: true
build:
  context: .
  containerfile: images/docker/platforms/Containerfile
  architectures:
  - amd64
  - arm64
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.opensuse.org/opensuse/leap:16.0@sha256:cd9aac11608afabc96a10074619cf2a65ccf60ff4b72d09d4e4e125af409035d
      type: external-image
    DISTRO_ID:
      value: opensuse-leap-16.0
      type: static
    ENGINE_PACKAGE:
      value: docker
      type: static
    RUN_AS_USER:
      value: root
      type: static
    HOME_DIR:
      value: /root
      type: static
    RUNTIME_DIR:
      value: /run
      type: static
    DOCKER_HOST_VALUE:
      value: unix:///var/run/docker.sock
      type: static
    STORAGE_PATH:
      value: /var/lib/docker
      type: static
dependencies:
  internal: []
  external:
  - name: opensuse-leap-16.0
    image: registry.opensuse.org/opensuse/leap
    arg: DISTRO_IMAGE
inputs:
- images/docker/docker-opensuse-leap-16.0-rootful/**
- images/docker/platforms/Containerfile
- images/docker/platforms/install-packages.sh
- images/docker/platforms/start-distro.sh
- shared/oci-labels.env
lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: '2026-10-27'
  supportBoundary: Vendor package revisions can advance with repository updates; image shares runner kernel and host security
    policy.
  requiredRuntimeProfiles:
  - docker
