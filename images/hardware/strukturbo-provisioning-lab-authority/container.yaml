# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: strukturbo-provisioning-lab-authority
version: v0.1.0
image: ghcr.io/strukturpiloten/strukturbo-provisioning-lab-authority
title: Strukturbo provisioning lab authority
description: Isolated-lab-only Unbound DNS and radvd authority fixture; never a physical
  management authority
build:
  githubActions: false
  context: .
  containerfile: images/hardware/strukturbo-provisioning-lab-authority/Containerfile
  architectures:
  - amd64
  scheduled: false
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora:44@sha256:b414c09be79dd1f32529b55b096b6bb30435d82ee16fbdbbabf8985eb5f86db0
      type: external-image
dependencies:
  internal: []
  external:
  - name: fedora-44
    image: registry.fedoraproject.org/fedora
    arg: FEDORA_IMAGE
inputs:
- images/hardware/strukturbo-provisioning-lab-authority/**
- shared/oci-labels.env
tests:
  hardware:
    role: lab-authority
lifecycle:
  state: experimental
  admission: isolated-test
  reviewAfter: '2026-12-31'
  supportBoundary: Local isolated network qualification only; no physical DHCP, DNS,
    RA or HTTP authority is authorized by this image.
  requiredRuntimeProfiles:
  - hardware
