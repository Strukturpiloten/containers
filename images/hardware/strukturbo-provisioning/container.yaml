# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: strukturbo-provisioning
version: v0.1.0
image: ghcr.io/strukturpiloten/strukturbo-provisioning
title: Strukturbo provisioning services
description: Prebuilt Kea DHCP4/DHCP6 and nginx HTTP services; configuration and artifact
  content are externally reviewed inputs
build:
  githubActions: false
  context: .
  containerfile: images/hardware/strukturbo-provisioning/Containerfile
  architectures:
  - amd64
  scheduled: false
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora:44@sha256:1da752148b03fd36679caa7d4ba2d7bbc638602539dad43f975d979e63429be6
      type: external-image
dependencies:
  internal: []
  external:
  - name: fedora-44
    image: registry.fedoraproject.org/fedora
    arg: FEDORA_IMAGE
inputs:
- images/hardware/strukturbo-provisioning/**
- shared/oci-labels.env
tests:
  hardware:
    role: provisioning
lifecycle:
  state: experimental
  admission: isolated-test
  reviewAfter: '2026-12-31'
  supportBoundary: Local isolated network qualification only; no physical DHCP, DNS,
    RA or HTTP authority is authorized by this image.
  requiredRuntimeProfiles:
  - hardware
