# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: strukturbo-hardware-builder
version: v0.1.0
image: ghcr.io/strukturpiloten/strukturbo-hardware-builder
title: Strukturbo hardware builder
description: Fedora 44 prebuilt builder tools for Strukturbo Hardware OS; no target
  package installation
build:
  githubActions: false
  context: .
  containerfile: images/hardware/strukturbo-hardware-builder/Containerfile
  architectures:
  - amd64
  scheduled: false
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora:44@sha256:b3e011d47e686a89781495c9a87bc80349af742965e5d51e79cd51711982e4a2
      type: external-image
    MKOSI_VERSION:
      value: '27.1'
      type: static
    MKOSI_COMMIT:
      value: ecf7f5702bb2052b7a69cab3fe7d37bc3b9ad77b
      type: static
    MKOSI_SHA256:
      value: 3d38e848f9b1108ec76d873f2c378dfc7d4b536ad89deffe8c97504f7a8dff43
      type: static
dependencies:
  internal: []
  external:
  - name: fedora-44
    image: registry.fedoraproject.org/fedora
    arg: FEDORA_IMAGE
inputs:
- images/hardware/strukturbo-hardware-builder/**
- shared/oci-labels.env
tests:
  hardware:
    role: builder
lifecycle:
  state: experimental
  admission: isolated-test
  reviewAfter: '2026-12-31'
  supportBoundary: Local x86-64 qualification only; no firmware executor, private
    collector source or production-hardware acceptance is included.
  requiredRuntimeProfiles:
  - hardware
