# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: strukturbo-hardware-discovery
version: v0.1.0
image: ghcr.io/strukturpiloten/strukturbo-hardware-discovery
title: Strukturbo hardware discovery
description: Fedora 44 prebuilt discovery tools for Strukturbo Hardware OS; no target
  package installation
build:
  githubActions: false
  context: .
  containerfile: images/hardware/strukturbo-hardware-discovery/Containerfile
  architectures:
  - amd64
  scheduled: false
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora:44@sha256:4688bc8003a1a6a7815e5f9d1f1b5c6bc9cafa582654af7cec61435d91655e3b
      type: external-image
dependencies:
  internal: []
  external:
  - name: fedora-44
    image: registry.fedoraproject.org/fedora
    arg: FEDORA_IMAGE
inputs:
- images/hardware/strukturbo-hardware-discovery/**
- shared/oci-labels.env
tests:
  hardware:
    role: discovery
lifecycle:
  state: experimental
  admission: isolated-test
  reviewAfter: '2026-12-31'
  supportBoundary: Local x86-64 qualification only; no firmware executor, private
    collector source or production-hardware acceptance is included.
  requiredRuntimeProfiles:
  - hardware
