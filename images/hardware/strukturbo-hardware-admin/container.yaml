# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: strukturbo-hardware-admin
version: v0.1.0
image: ghcr.io/strukturpiloten/strukturbo-hardware-admin
title: Strukturbo hardware admin
description: Fedora 44 prebuilt admin tools for Strukturbo Hardware OS; no target
  package installation
build:
  context: .
  containerfile: images/hardware/strukturbo-hardware-admin/Containerfile
  architectures:
  - amd64
  scheduled: false
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora:44@sha256:cb3bd21415bd82a2fae1a9379f3f972fa8e78d460c9f86101274d13230dd6fd6
      type: external-image
dependencies:
  internal: []
  external:
  - name: fedora-44
    image: registry.fedoraproject.org/fedora
    arg: FEDORA_IMAGE
inputs:
- images/hardware/strukturbo-hardware-admin/**
- shared/oci-labels.env
tests:
  hardware:
    role: admin
lifecycle:
  state: experimental
  admission: isolated-test
  reviewAfter: '2026-12-31'
  supportBoundary: Local x86-64 qualification only; no firmware executor, private
    collector source or production-hardware acceptance is included.
  requiredRuntimeProfiles:
  - hardware
