# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-debian-13-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-debian-13-rootless
title: Debian 13 Podman rootless
description: Debian 13 distro-packaged Podman rootless compatibility image for CI

tests:
  podman:
    mode: rootless
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/debian-13/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/debian:13@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: debian-13
      image: docker.io/library/debian
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-debian-13-rootless/**
  - images/podman/platforms/debian-13/**
  - shared/oci-labels.env
