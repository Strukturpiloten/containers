# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-centos-stream-10-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-centos-stream-10-rootless
title: CentOS Stream 10 Podman rootless
description: CentOS Stream 10 distro-packaged Podman rootless compatibility image for CI

lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: "2026-12-31"
  supportBoundary: "Repository rebuilds refresh distribution packages; vendor support determines installed Podman security maintenance."
  requiredRuntimeProfiles:
    - podman

tests:
  podman:
    mode: rootless
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/centos-stream-10/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: quay.io/centos/centos:stream10@sha256:a946db5352840d41d0de13d50e3510228f25b7ba1e8b657291c652f762b12532
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: centos-stream-10
      image: quay.io/centos/centos
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-centos-stream-10-rootless/**
  - images/podman/platforms/centos-stream-10/**
  - shared/oci-labels.env
