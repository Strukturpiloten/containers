# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-fedora-44-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-fedora-44-rootful
title: Fedora 44 Podman rootful
description: Fedora 44 distro-packaged Podman rootful compatibility image for CI

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/fedora-44/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.fedoraproject.org/fedora:44@sha256:f7bf5bc0ffeb620e36d960285d6e7f3d358d7c93a91db1d8d1cdd4759e172770
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: fedora-44
      image: registry.fedoraproject.org/fedora
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-fedora-44-rootful/**
  - images/podman/platforms/fedora-44/**
  - shared/oci-labels.env
