# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-debian-13-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-debian-13-rootful
title: Debian 13 Podman rootful
description: Debian 13 distro-packaged Podman rootful compatibility image for CI

lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: "2026-12-31"
  supportBoundary: "Repository rebuilds refresh distribution packages; vendor support determines installed Podman security maintenance."
  requiredRuntimeProfiles:
    - podman

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/debian-13/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/debian:13@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: debian-13
      image: docker.io/library/debian
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-debian-13-rootful/**
  - images/podman/platforms/debian-13/**
  - shared/oci-labels.env
