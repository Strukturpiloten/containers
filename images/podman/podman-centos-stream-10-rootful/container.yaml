# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-centos-stream-10-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-centos-stream-10-rootful
title: CentOS Stream 10 Podman rootful
description: CentOS Stream 10 distro-packaged Podman rootful compatibility image for CI

lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: "2026-12-31"
  supportBoundary: "Repository rebuilds refresh distribution packages; vendor support determines installed Podman security maintenance."
  requiredRuntimeProfiles:
    - podman

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/centos-stream-10/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: quay.io/centos/centos:stream10@sha256:99b8fe27dd4958b5dc2630ce35f5f6a7ff7bf9b2b1a72078102fde50d3277550
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: centos-stream-10
      image: quay.io/centos/centos
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-centos-stream-10-rootful/**
  - images/podman/platforms/centos-stream-10/**
  - shared/oci-labels.env
