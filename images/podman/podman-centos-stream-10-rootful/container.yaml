# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-centos-stream-10-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-centos-stream-10-rootful
title: CentOS Stream 10 Podman rootful
description: CentOS Stream 10 distro-packaged Podman rootful compatibility image for CI

build:
  context: .
  containerfile: images/podman/distro-shared/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: quay.io/centos/centos:stream10@sha256:ad14f7d919c9b9995a236abace06e888d37d6145e048a6ae26770e1f5dc718a8
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: centos-stream-10
      image: quay.io/centos/centos
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-centos-stream-10-rootful/**
  - images/podman/distro-shared/**
  - images/podman/shared/**
  - shared/oci-labels.env
