# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-5.4-rootless
version: v5.4.2
image: ghcr.io/strukturpiloten/podman-5.4-rootless
title: Podman 5.4 rootless
description: Podman 5.4 rootless nested-container image built from source on Fedora

lifecycle:
  state: legacy
  admission: isolated-test
  reviewAfter: "2026-12-31"
  supportBoundary: "Pinned historical Podman source is retained for compatibility; OS refreshes do not patch that engine line."
  requiredRuntimeProfiles:
    - podman

tests:
  podman:
    mode: rootless
    outerPrivilege: unprivileged

build:
  context: .
  containerfile: images/podman/shared/Containerfile
  payload: images/podman/payloads/podman-5.4.yaml
  architectures: [amd64, arm64]
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora-minimal:44@sha256:14650b8fe70beccd52997d1d118cdbd527696c97a4b68628202db63b8a7b4abd
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: fedora-minimal
      image: registry.fedoraproject.org/fedora-minimal
      arg: FEDORA_IMAGE

inputs:
  - images/podman/podman-5.4-rootless/**
  - images/podman/shared/**
  - images/podman/payloads/podman-5.4.yaml
  - shared/oci-labels.env
