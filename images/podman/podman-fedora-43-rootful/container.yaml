# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-fedora-43-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-fedora-43-rootful
title: Fedora 43 Podman rootful
description: Fedora 43 distro-packaged Podman rootful compatibility image for CI

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/fedora-43/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.fedoraproject.org/fedora:43@sha256:8d775fbb86b8aa62172a2fd33203d285743ad2b74df8416322066e59e917b4ef
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: fedora-43
      image: registry.fedoraproject.org/fedora
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-fedora-43-rootful/**
  - images/podman/platforms/fedora-43/**
  - shared/oci-labels.env
