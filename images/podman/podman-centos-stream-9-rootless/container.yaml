# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-centos-stream-9-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-centos-stream-9-rootless
title: CentOS Stream 9 Podman rootless
description: CentOS Stream 9 distro-packaged Podman rootless compatibility image for CI

lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: "2026-12-31"
  supportBoundary: "Repository rebuilds refresh distribution packages; vendor support determines installed Podman security maintenance."
  requiredRuntimeProfiles:
    - podman

tests:
  podman:
    mode: rootless
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/centos-stream-9/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: quay.io/centos/centos:stream9@sha256:33346f5fe280763eb78e85f968ad52bc2b2013369de85403f67e802db98ed243
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: centos-stream-9
      image: quay.io/centos/centos
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-centos-stream-9-rootless/**
  - images/podman/platforms/centos-stream-9/**
  - shared/oci-labels.env
