# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-6.0-rootful
version: v6.0.2
image: ghcr.io/strukturpiloten/podman-6.0-rootful
title: Podman 6.0 rootful
description: Podman 6.0 rootful nested-container image built from source on Fedora

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/shared/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora-minimal:44@sha256:5cbed3b27901c38dfcfeb6daa285681d4599b0532bbb99079d6283faf2853401
      type: external-image
    PODMAN_COMMIT:
      value: b28edb9ad70ce4317dc762ee9ce0a6d081d154e9
      type: static
    PODMAN_REPOSITORY:
      value: https://github.com/podman-container-tools/podman.git
      type: static
    NETAVARK_VERSION: {value: 2.1.0, type: static}
    NETAVARK_COMMIT: {value: 8e91ad1d947ed325327b638f0cb906bea1f7d0ab, type: static}
    AARDVARK_VERSION: {value: 2.1.0, type: static}
    AARDVARK_COMMIT: {value: cd7417681229219059939bdd9f0b3bd9ac9abb08, type: static}
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: fedora-minimal
      image: registry.fedoraproject.org/fedora-minimal
      arg: FEDORA_IMAGE

inputs:
  - images/podman/podman-6.0-rootful/**
  - images/podman/shared/**
  - shared/oci-labels.env
