# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-6.0-rootful
version: v6.0.2
image: ghcr.io/strukturpiloten/podman-6.0-rootful
title: Podman 6.0 rootful
description: Podman 6.0 rootful nested-container image built from source on Fedora

lifecycle:
  state: legacy
  admission: isolated-test
  reviewAfter: "2026-12-31"
  supportBoundary: "Pinned historical Podman source is retained for compatibility; OS refreshes do not patch that engine line."
  requiredRuntimeProfiles:
    - podman

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/shared/Containerfile
  payload: images/podman/payloads/podman-6.0.yaml
  architectures: [amd64, arm64]
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora-minimal:44@sha256:77dae00ae95866fe18f1ee83f2eed8f1e92db3da0dd8396e35f900f050eb9e40
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: fedora-minimal
      image: registry.fedoraproject.org/fedora-minimal
      arg: FEDORA_IMAGE

inputs:
  - images/podman/podman-6.0-rootful/**
  - images/podman/shared/**
  - images/podman/payloads/podman-6.0.yaml
  - shared/oci-labels.env
