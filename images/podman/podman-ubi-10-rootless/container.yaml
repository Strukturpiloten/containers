# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-ubi-10-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-ubi-10-rootless
title: Red Hat UBI 10 Podman rootless
description: Red Hat UBI 10 distro-packaged Podman rootless compatibility image for CI

lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: "2026-12-31"
  supportBoundary: "Repository rebuilds refresh distribution packages; vendor support determines installed Podman security maintenance."
  requiredRuntimeProfiles:
    - podman

tests:
  podman:
    mode: rootless
    outerPrivilege: privileged
    nestedRuntime: false

build:
  context: .
  containerfile: images/podman/platforms/ubi-10/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.access.redhat.com/ubi10/ubi:latest@sha256:3ef7bffd1dc7e55f8d34d5cc9737d188e3b9613e562942d2955e2fc867dd74d2
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: ubi-10
      image: registry.access.redhat.com/ubi10/ubi
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-ubi-10-rootless/**
  - images/podman/platforms/ubi-10/**
  - shared/oci-labels.env
