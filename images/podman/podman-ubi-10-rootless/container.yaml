# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-ubi-10-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-ubi-10-rootless
title: Red Hat UBI 10 Podman rootless
description: Red Hat UBI 10 distro-packaged Podman rootless compatibility image for CI

build:
  context: .
  containerfile: images/podman/distro-shared/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.access.redhat.com/ubi10/ubi:latest@sha256:145a2d6e7e224d34fbe601832e3f133c11560e15b4074fad75c449387bb105a0
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: ubi-10
      image: registry.access.redhat.com/ubi10/ubi
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-ubi-10-rootless/**
  - images/podman/distro-shared/**
  - images/podman/shared/**
  - shared/oci-labels.env
