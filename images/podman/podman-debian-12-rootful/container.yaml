# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-debian-12-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-debian-12-rootful
title: Debian 12 Podman rootful
description: Debian 12 distro-packaged Podman rootful compatibility image for CI

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/debian-12/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/debian:12@sha256:f37a335e82bca302e955fa39f9dfe28f1be618f016f8a2b56318e5a5111afc26
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: debian-12
      image: docker.io/library/debian
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-debian-12-rootful/**
  - images/podman/platforms/debian-12/**
  - shared/oci-labels.env
