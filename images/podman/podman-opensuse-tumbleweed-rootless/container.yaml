# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-opensuse-tumbleweed-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-opensuse-tumbleweed-rootless
title: openSUSE Tumbleweed Podman rootless
description: openSUSE Tumbleweed distro-packaged Podman rootless compatibility image for CI

tests:
  podman:
    mode: rootless
    outerPrivilege: privileged
    nestedRuntime: false

build:
  context: .
  containerfile: images/podman/platforms/opensuse-tumbleweed/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.opensuse.org/opensuse/tumbleweed:latest@sha256:371c01a9cd8578a96f9e9a4ca16b653c12c3fd975efbded8d5b2644701ca6fbf
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: opensuse-tumbleweed
      image: registry.opensuse.org/opensuse/tumbleweed
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-opensuse-tumbleweed-rootless/**
  - images/podman/platforms/opensuse-tumbleweed/**
  - shared/oci-labels.env
