# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-fedora-44-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-fedora-44-rootless
title: Fedora 44 Podman rootless
description: Fedora 44 distro-packaged Podman rootless compatibility image for CI

tests:
  podman:
    mode: rootless
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/fedora-44/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.fedoraproject.org/fedora:44@sha256:91de50d5e86946a31db8b210009b11fb35d34125689568c5c24f6bdfbf64228a
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: fedora-44
      image: registry.fedoraproject.org/fedora
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-fedora-44-rootless/**
  - images/podman/platforms/fedora-44/**
  - shared/oci-labels.env
