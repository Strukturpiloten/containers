# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-ubi-10-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-ubi-10-rootful
title: Red Hat UBI 10 Podman rootful
description: Red Hat UBI 10 distro-packaged Podman rootful compatibility image for CI

lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: "2026-12-31"
  supportBoundary: "Repository rebuilds refresh distribution packages; vendor support determines installed Podman security maintenance."
  requiredRuntimeProfiles:
    - podman

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/ubi-10/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.access.redhat.com/ubi10/ubi:latest@sha256:87ceab8634a53a36c75a8ba7282f09f11c46ab3e8906db6c6d2b3cd2a7dc4f4e
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: ubi-10
      image: registry.access.redhat.com/ubi10/ubi
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-ubi-10-rootful/**
  - images/podman/platforms/ubi-10/**
  - shared/oci-labels.env
