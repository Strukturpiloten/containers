# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-debian-11-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-debian-11-rootless
title: Debian 11 Podman rootless
description: Debian 11 distro-packaged Podman rootless compatibility image for CI

tests:
  podman:
    mode: rootless
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/debian-11/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/debian:11@sha256:99cdf7792e25416bd801861ccd8e2fb27fb527b25e8d9a8704ebc3ead2015675
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: debian-11
      image: docker.io/library/debian
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-debian-11-rootless/**
  - images/podman/platforms/debian-11/**
  - shared/oci-labels.env
