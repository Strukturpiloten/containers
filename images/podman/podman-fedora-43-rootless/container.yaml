# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-fedora-43-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-fedora-43-rootless
title: Fedora 43 Podman rootless
description: Fedora 43 distro-packaged Podman rootless compatibility image for CI

tests:
  podman:
    mode: rootless
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/fedora-43/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.fedoraproject.org/fedora:43@sha256:988bb2d658e130c4bf2ef35df9888106f9b16d826e345747a52e19f22111dd8f
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: fedora-43
      image: registry.fedoraproject.org/fedora
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-fedora-43-rootless/**
  - images/podman/platforms/fedora-43/**
  - shared/oci-labels.env
