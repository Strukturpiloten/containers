# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-6.1-rootless
version: v6.1.2
image: ghcr.io/strukturpiloten/podman-6.1-rootless
title: Podman 6.1 rootless
description: Podman 6.1 rootless nested-container image built from source on Fedora

lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: "2026-12-31"
  supportBoundary: "Selected source-built Podman line receives repository rebuilds; upstream engine fixes require reviewed source updates."
  requiredRuntimeProfiles:
    - podman

tests:
  podman:
    mode: rootless
    outerPrivilege: unprivileged

build:
  context: .
  containerfile: images/podman/shared/Containerfile
  payload: images/podman/payloads/podman-6.1.yaml
  architectures: [amd64, arm64]
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora-minimal:44@sha256:77dae00ae95866fe18f1ee83f2eed8f1e92db3da0dd8396e35f900f050eb9e40
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: fedora-minimal
      image: registry.fedoraproject.org/fedora-minimal
      arg: FEDORA_IMAGE

inputs:
  - images/podman/podman-6.1-rootless/**
  - images/podman/shared/**
  - images/podman/payloads/podman-6.1.yaml
  - shared/oci-labels.env
