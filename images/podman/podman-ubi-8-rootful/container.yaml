# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-ubi-8-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-ubi-8-rootful
title: Red Hat UBI 8 Podman rootful
description: Red Hat UBI 8 distro-packaged Podman rootful compatibility image for CI

lifecycle:
  state: legacy
  admission: isolated-test
  reviewAfter: "2026-12-31"
  supportBoundary: "Historical distribution compatibility fixture; vendor security support and installed engine fixes require separate review."
  requiredRuntimeProfiles:
    - podman

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/ubi-8/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.access.redhat.com/ubi8/ubi:latest@sha256:f5aba2d17411c752f14b06f3b52e3002634e63d13996196b642d2144475454e2
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: ubi-8
      image: registry.access.redhat.com/ubi8/ubi
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-ubi-8-rootful/**
  - images/podman/platforms/ubi-8/**
  - shared/oci-labels.env
