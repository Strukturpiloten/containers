# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-ubuntu-26.04-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-ubuntu-26.04-rootful
title: Ubuntu 26.04 Podman rootful
description: Ubuntu 26.04 distro-packaged Podman rootful compatibility image for CI

build:
  context: .
  containerfile: images/podman/distro-shared/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: ubuntu-26.04
      image: docker.io/library/ubuntu
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-ubuntu-26.04-rootful/**
  - images/podman/distro-shared/**
  - images/podman/shared/**
  - shared/oci-labels.env
