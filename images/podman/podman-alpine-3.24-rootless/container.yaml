# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-alpine-3.24-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-alpine-3.24-rootless
title: Alpine 3.24 Podman rootless
description: Alpine 3.24 distro-packaged Podman rootless compatibility image for CI

tests:
  podman:
    mode: rootless
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/alpine-3.24/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: alpine-3.24
      image: docker.io/library/alpine
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-alpine-3.24-rootless/**
  - images/podman/platforms/alpine-3.24/**
  - shared/oci-labels.env
