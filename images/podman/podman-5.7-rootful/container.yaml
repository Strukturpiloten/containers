# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-5.7-rootful
version: v5.7.1
image: ghcr.io/strukturpiloten/podman-5.7-rootful
title: Podman 5.7 rootful
description: Podman 5.7 rootful nested-container image built from source on Fedora

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/shared/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora-minimal:44@sha256:4190fe8f01fceecea7bb6c004210da2164cb292057283cfbfeff0d708f389fc5
      type: external-image
    PODMAN_COMMIT:
      value: f845d14e941889ba4c071f35233d09b29d363c75
      type: static
    PODMAN_REPOSITORY:
      value: https://github.com/podman-container-tools/podman.git
      type: static
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: fedora-minimal
      image: registry.fedoraproject.org/fedora-minimal
      arg: FEDORA_IMAGE

inputs:
  - images/podman/podman-5.7-rootful/**
  - images/podman/shared/**
  - shared/oci-labels.env
