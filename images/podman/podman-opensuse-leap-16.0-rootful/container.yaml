# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-opensuse-leap-16.0-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-opensuse-leap-16.0-rootful
title: openSUSE Leap 16.0 Podman rootful
description: openSUSE Leap 16.0 distro-packaged Podman rootful compatibility image for CI

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/opensuse-leap-16.0/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.opensuse.org/opensuse/leap:16.0@sha256:5bc9e1242fc2c92dbbcaf4db5e2eadad062c4c0434550c53822201f18799d55a
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: opensuse-leap-16.0
      image: registry.opensuse.org/opensuse/leap
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-opensuse-leap-16.0-rootful/**
  - images/podman/platforms/opensuse-leap-16.0/**
  - shared/oci-labels.env
