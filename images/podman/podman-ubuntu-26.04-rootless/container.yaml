# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-ubuntu-26.04-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-ubuntu-26.04-rootless
title: Ubuntu 26.04 Podman rootless
description: Ubuntu 26.04 distro-packaged Podman rootless compatibility image for CI

lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: "2026-12-31"
  supportBoundary: "Repository rebuilds refresh distribution packages; vendor support determines installed Podman security maintenance."
  requiredRuntimeProfiles:
    - podman

tests:
  podman:
    mode: rootless
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/ubuntu-26.04/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/ubuntu:26.04@sha256:3595d7fc4286a33fad0fd853a4063e654287a9c3787437d7937c94ca3f7a804e
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: ubuntu-26.04
      image: docker.io/library/ubuntu
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-ubuntu-26.04-rootless/**
  - images/podman/platforms/ubuntu-26.04/**
  - shared/oci-labels.env
