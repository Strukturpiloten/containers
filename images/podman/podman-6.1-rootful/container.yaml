# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-6.1-rootful
version: v6.1.2
image: ghcr.io/strukturpiloten/podman-6.1-rootful
title: Podman 6.1 rootful
description: Podman 6.1 rootful nested-container image built from source on Fedora

lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: "2026-12-31"
  supportBoundary: "Selected source-built Podman line receives repository rebuilds; upstream engine fixes require reviewed source updates."
  requiredRuntimeProfiles:
    - podman

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/shared/Containerfile
  payload: images/podman/payloads/podman-6.1.yaml
  architectures: [amd64, arm64]
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora-minimal:44@sha256:eeac878460ca077301befe60ba603186b12af7ff45a58ee9aeafefbcf4c26f10
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: fedora-minimal
      image: registry.fedoraproject.org/fedora-minimal
      arg: FEDORA_IMAGE

inputs:
  - images/podman/podman-6.1-rootful/**
  - images/podman/shared/**
  - images/podman/payloads/podman-6.1.yaml
  - shared/oci-labels.env
