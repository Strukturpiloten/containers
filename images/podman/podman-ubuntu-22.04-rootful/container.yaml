# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-ubuntu-22.04-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-ubuntu-22.04-rootful
title: Ubuntu 22.04 Podman rootful
description: Ubuntu 22.04 distro-packaged Podman rootful compatibility image for CI

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/ubuntu-22.04/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: ubuntu-22.04
      image: docker.io/library/ubuntu
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-ubuntu-22.04-rootful/**
  - images/podman/platforms/ubuntu-22.04/**
  - shared/oci-labels.env
