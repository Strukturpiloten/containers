# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-ubi-8-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-ubi-8-rootless
title: Red Hat UBI 8 Podman rootless
description: Red Hat UBI 8 distro-packaged Podman rootless compatibility image for CI

tests:
  podman:
    mode: rootless
    outerPrivilege: privileged
    nestedRuntime: false

build:
  context: .
  containerfile: images/podman/platforms/ubi-8/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.access.redhat.com/ubi8/ubi:latest@sha256:2dcfc23b79d88fdaeefc6ed0cfb144e41dca600bfa73c38ab5d8dca5b05d1b7f
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: ubi-8
      image: registry.access.redhat.com/ubi8/ubi
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-ubi-8-rootless/**
  - images/podman/platforms/ubi-8/**
  - shared/oci-labels.env
