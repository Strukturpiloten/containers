# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-arch-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-arch-rootless
title: Arch Linux Podman rootless
description: Arch Linux distro-packaged Podman rootless compatibility image for CI

tests:
  podman:
    mode: rootless
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/arch/Containerfile
  architectures: [amd64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/archlinux:base@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: arch
      image: docker.io/library/archlinux
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-arch-rootless/**
  - images/podman/platforms/arch/**
  - shared/oci-labels.env
