# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-opensuse-leap-16.0-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-opensuse-leap-16.0-rootless
title: openSUSE Leap 16.0 Podman rootless
description: openSUSE Leap 16.0 distro-packaged Podman rootless compatibility image for CI

build:
  context: .
  containerfile: images/podman/distro-shared/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.opensuse.org/opensuse/leap:16.0@sha256:6a8998a33df6164d29d545c1bb8d9dd5a3595206d993b1a43c54de9aa33d8feb
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: opensuse-leap-16.0
      image: registry.opensuse.org/opensuse/leap
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-opensuse-leap-16.0-rootless/**
  - images/podman/distro-shared/**
  - images/podman/shared/**
  - shared/oci-labels.env
