# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-ubuntu-24.04-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-ubuntu-24.04-rootful
title: Ubuntu 24.04 Podman rootful
description: Ubuntu 24.04 distro-packaged Podman rootful compatibility image for CI

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/ubuntu-24.04/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: ubuntu-24.04
      image: docker.io/library/ubuntu
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-ubuntu-24.04-rootful/**
  - images/podman/platforms/ubuntu-24.04/**
  - shared/oci-labels.env
