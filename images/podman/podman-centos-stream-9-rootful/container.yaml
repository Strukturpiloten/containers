# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-centos-stream-9-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-centos-stream-9-rootful
title: CentOS Stream 9 Podman rootful
description: CentOS Stream 9 distro-packaged Podman rootful compatibility image for CI

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/centos-stream-9/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: quay.io/centos/centos:stream9@sha256:7d3c87ab567add60d0153a6a17bc10d0f19cd982a2d533724298ebd1ee751eab
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: centos-stream-9
      image: quay.io/centos/centos
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-centos-stream-9-rootful/**
  - images/podman/platforms/centos-stream-9/**
  - shared/oci-labels.env
