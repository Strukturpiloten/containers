# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-ubi-9-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-ubi-9-rootful
title: Red Hat UBI 9 Podman rootful
description: Red Hat UBI 9 distro-packaged Podman rootful compatibility image for CI

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/ubi-9/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.access.redhat.com/ubi9/ubi:latest@sha256:b8c53f907b7ea8934d6bb23b319ca7b5ab567e61a0806ffc80170631cabc7563
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: ubi-9
      image: registry.access.redhat.com/ubi9/ubi
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-ubi-9-rootful/**
  - images/podman/platforms/ubi-9/**
  - shared/oci-labels.env
