# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-5.7-rootless
version: v5.7.1
image: ghcr.io/strukturpiloten/podman-5.7-rootless
title: Podman 5.7 rootless
description: Podman 5.7 rootless nested-container image built from source on Fedora

build:
  context: .
  containerfile: images/podman/shared/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora-minimal:46@sha256:647f70a56b1f5a0f0ea02fe8b291df0334d5b7df1c5bafc2e1f473238e7ba5b1
      type: external-image
    PODMAN_COMMIT:
      value: f845d14e941889ba4c071f35233d09b29d363c75
      type: static
    PODMAN_REPOSITORY:
      value: https://github.com/podman-container-tools/podman.git
      type: static
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: fedora-minimal
      image: registry.fedoraproject.org/fedora-minimal
      arg: FEDORA_IMAGE

inputs:
  - images/podman/podman-5.7-rootless/**
  - images/podman/shared/**
  - shared/oci-labels.env
