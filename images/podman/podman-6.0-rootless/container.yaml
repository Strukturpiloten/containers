# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-6.0-rootless
version: v6.0.2
image: ghcr.io/strukturpiloten/podman-6.0-rootless
title: Podman 6.0 rootless
description: Podman 6.0 rootless nested-container image built from source on Fedora

build:
  context: .
  containerfile: images/podman/shared/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora-minimal:44@sha256:c12e511d5bacb9ae2949c95c4790176852edcffa3023fe661f45f0331d6a131a
      type: external-image
    PODMAN_COMMIT:
      value: b28edb9ad70ce4317dc762ee9ce0a6d081d154e9
      type: static
    PODMAN_REPOSITORY:
      value: https://github.com/podman-container-tools/podman.git
      type: static
    NETAVARK_VERSION: {value: 2.1.0, type: static}
    NETAVARK_COMMIT: {value: 8e91ad1d947ed325327b638f0cb906bea1f7d0ab, type: static}
    AARDVARK_VERSION: {value: 2.1.0, type: static}
    AARDVARK_COMMIT: {value: cd7417681229219059939bdd9f0b3bd9ac9abb08, type: static}
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: fedora-minimal
      image: registry.fedoraproject.org/fedora-minimal
      arg: FEDORA_IMAGE

inputs:
  - images/podman/podman-6.0-rootless/**
  - images/podman/shared/**
  - shared/oci-labels.env
