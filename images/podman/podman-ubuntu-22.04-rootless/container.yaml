# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-ubuntu-22.04-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-ubuntu-22.04-rootless
title: Ubuntu 22.04 Podman rootless
description: Ubuntu 22.04 distro-packaged Podman rootless compatibility image for CI

lifecycle:
  state: maintained
  admission: isolated-test
  reviewAfter: "2026-12-31"
  supportBoundary: "Repository rebuilds refresh distribution packages; vendor support determines installed Podman security maintenance."
  requiredRuntimeProfiles:
    - podman

tests:
  podman:
    mode: rootless
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/ubuntu-22.04/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/ubuntu:22.04@sha256:b1066385161d28ddf6bc7e7b28a9170eec11484c821d1a5150d176cbde41d7f7
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: ubuntu-22.04
      image: docker.io/library/ubuntu
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-ubuntu-22.04-rootless/**
  - images/podman/platforms/ubuntu-22.04/**
  - shared/oci-labels.env
