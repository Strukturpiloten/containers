# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-5.5-rootless
version: v5.5.2
image: ghcr.io/strukturpiloten/podman-5.5-rootless
title: Podman 5.5 rootless
description: Podman 5.5 rootless nested-container image built from source on Fedora

build:
  context: .
  containerfile: images/podman/shared/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora-minimal:44@sha256:fb20d0a6558889c2bcc038ac77e2be551e3f989fc54b03e7cc5c90a539035b72
      type: external-image
    PODMAN_COMMIT:
      value: e7d8226745ba07a64b7176a7f128e4ef53225a0e
      type: static
    PODMAN_REPOSITORY:
      value: https://github.com/podman-container-tools/podman.git
      type: static
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: fedora-minimal
      image: registry.fedoraproject.org/fedora-minimal
      arg: FEDORA_IMAGE

inputs:
  - images/podman/podman-5.5-rootless/**
  - images/podman/shared/**
  - shared/oci-labels.env
