# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-arch-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-arch-rootful
title: Arch Linux Podman rootful
description: Arch Linux distro-packaged Podman rootful compatibility image for CI

lifecycle:
  state: experimental
  admission: isolated-test
  reviewAfter: "2026-12-31"
  supportBoundary: "Rolling distribution compatibility fixture; installed engine and package support must be reviewed for each rebuild."
  requiredRuntimeProfiles:
    - podman

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/arch/Containerfile
  architectures: [amd64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/archlinux:base@sha256:4e77cf2ea5f410e6f8be5abf93ccf17ce2436e87a138c167208356711a405dbd
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: arch
      image: docker.io/library/archlinux
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-arch-rootful/**
  - images/podman/platforms/arch/**
  - shared/oci-labels.env
