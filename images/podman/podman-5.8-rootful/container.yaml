# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-5.8-rootful
version: v5.8.6
image: ghcr.io/strukturpiloten/podman-5.8-rootful
title: Podman 5.8 rootful
description: Podman 5.8 rootful nested-container image built from source on Fedora

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/shared/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora-minimal:44@sha256:5cbed3b27901c38dfcfeb6daa285681d4599b0532bbb99079d6283faf2853401
      type: external-image
    PODMAN_COMMIT:
      value: a859fc66702c23e869c282c63e92d9b6cd264229
      type: static
    PODMAN_REPOSITORY:
      value: https://github.com/podman-container-tools/podman.git
      type: static
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: fedora-minimal
      image: registry.fedoraproject.org/fedora-minimal
      arg: FEDORA_IMAGE

inputs:
  - images/podman/podman-5.8-rootful/**
  - images/podman/shared/**
  - shared/oci-labels.env
