# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-opensuse-tumbleweed-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-opensuse-tumbleweed-rootful
title: openSUSE Tumbleweed Podman rootful
description: openSUSE Tumbleweed distro-packaged Podman rootful compatibility image for CI

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/opensuse-tumbleweed/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.opensuse.org/opensuse/tumbleweed:latest@sha256:87eb3e69082bee2629fd71460c2bc015893b4bd045e9de098213cd406fdbb9ef
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: opensuse-tumbleweed
      image: registry.opensuse.org/opensuse/tumbleweed
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-opensuse-tumbleweed-rootful/**
  - images/podman/platforms/opensuse-tumbleweed/**
  - shared/oci-labels.env
