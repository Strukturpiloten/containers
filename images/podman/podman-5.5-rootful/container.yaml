# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-5.5-rootful
version: v5.5.2
image: ghcr.io/strukturpiloten/podman-5.5-rootful
title: Podman 5.5 rootful
description: Podman 5.5 rootful nested-container image built from source on Fedora

lifecycle:
  state: legacy
  admission: isolated-test
  reviewAfter: "2026-12-31"
  supportBoundary: "Pinned historical Podman source is retained for compatibility; OS refreshes do not patch that engine line."
  requiredRuntimeProfiles:
    - podman

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/shared/Containerfile
  payload: images/podman/payloads/podman-5.5.yaml
  architectures: [amd64, arm64]
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora-minimal:44@sha256:14650b8fe70beccd52997d1d118cdbd527696c97a4b68628202db63b8a7b4abd
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: fedora-minimal
      image: registry.fedoraproject.org/fedora-minimal
      arg: FEDORA_IMAGE

inputs:
  - images/podman/podman-5.5-rootful/**
  - images/podman/shared/**
  - images/podman/payloads/podman-5.5.yaml
  - shared/oci-labels.env
