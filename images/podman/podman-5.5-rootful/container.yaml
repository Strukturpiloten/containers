# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-5.5-rootful
version: v5.5.2
image: ghcr.io/strukturpiloten/podman-5.5-rootful
title: Podman 5.5 rootful
description: Podman 5.5 rootful nested-container image built from source on Fedora

build:
  context: .
  containerfile: images/podman/shared/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora-minimal:46@sha256:bc87c648bf1dc7a42ad2396f0162eb3deb6a02ad71d9b386ede9e8b3119a3a63
      type: external-image
    PODMAN_COMMIT:
      value: e7d8226745ba07a64b7176a7f128e4ef53225a0e
      type: static
    PODMAN_REPOSITORY:
      value: https://github.com/podman-container-tools/podman.git
      type: static
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: fedora-minimal
      image: registry.fedoraproject.org/fedora-minimal
      arg: FEDORA_IMAGE

inputs:
  - images/podman/podman-5.5-rootful/**
  - images/podman/shared/**
  - shared/oci-labels.env
