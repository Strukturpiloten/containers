# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-ubi-9-rootless
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-ubi-9-rootless
title: Red Hat UBI 9 Podman rootless
description: Red Hat UBI 9 distro-packaged Podman rootless compatibility image for CI

tests:
  podman:
    mode: rootless
    outerPrivilege: privileged
    nestedRuntime: false

build:
  context: .
  containerfile: images/podman/platforms/ubi-9/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: registry.access.redhat.com/ubi9/ubi:latest@sha256:f405b019ad4f6ebf9097b636e83b363b1f11afe26557b7896fabff954b65a1b8
      type: external-image
    HOME_DIR: {value: /home/podman, type: static}
    RUN_AS_USER: {value: podman, type: static}
    RUNTIME_DIR: {value: /run/user/1000, type: static}
    STORAGE_PATH: {value: /home/podman/.local/share/containers, type: static}

dependencies:
  internal: []
  external:
    - name: ubi-9
      image: registry.access.redhat.com/ubi9/ubi
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-ubi-9-rootless/**
  - images/podman/platforms/ubi-9/**
  - shared/oci-labels.env
