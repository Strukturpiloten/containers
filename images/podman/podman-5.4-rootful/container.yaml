# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-5.4-rootful
version: v5.4.2
image: ghcr.io/strukturpiloten/podman-5.4-rootful
title: Podman 5.4 rootful
description: Podman 5.4 rootful nested-container image built from source on Fedora

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/shared/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: FEDORA_IMAGE
  args:
    FEDORA_IMAGE:
      value: registry.fedoraproject.org/fedora-minimal:44@sha256:e4e7d957a406732e4bb408dc6516ced63d353076413f1fbfd16de0eba4f825e1
      type: external-image
    PODMAN_COMMIT:
      value: be85287fcf4590961614ee37be65eeb315e5d9ff
      type: static
    PODMAN_REPOSITORY:
      value: https://github.com/podman-container-tools/podman.git
      type: static
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: fedora-minimal
      image: registry.fedoraproject.org/fedora-minimal
      arg: FEDORA_IMAGE

inputs:
  - images/podman/podman-5.4-rootful/**
  - images/podman/shared/**
  - shared/oci-labels.env
