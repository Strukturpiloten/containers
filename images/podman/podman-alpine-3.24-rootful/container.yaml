# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-alpine-3.24-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-alpine-3.24-rootful
title: Alpine 3.24 Podman rootful
description: Alpine 3.24 distro-packaged Podman rootful compatibility image for CI

build:
  context: .
  containerfile: images/podman/distro-shared/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: alpine-3.24
      image: docker.io/library/alpine
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-alpine-3.24-rootful/**
  - images/podman/distro-shared/**
  - images/podman/shared/**
  - shared/oci-labels.env
