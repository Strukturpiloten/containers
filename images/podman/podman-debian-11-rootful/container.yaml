# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: podman-debian-11-rootful
version: v1.0.0
image: ghcr.io/strukturpiloten/podman-debian-11-rootful
title: Debian 11 Podman rootful
description: Debian 11 distro-packaged Podman rootful compatibility image for CI

tests:
  podman:
    mode: rootful
    outerPrivilege: privileged

build:
  context: .
  containerfile: images/podman/platforms/debian-11/Containerfile
  architectures: [amd64, arm64]
  runtimeBaseArg: DISTRO_IMAGE
  args:
    DISTRO_IMAGE:
      value: docker.io/library/debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9
      type: external-image
    HOME_DIR: {value: /root, type: static}
    RUN_AS_USER: {value: root, type: static}
    RUNTIME_DIR: {value: /run, type: static}
    STORAGE_PATH: {value: /var/lib/containers, type: static}

dependencies:
  internal: []
  external:
    - name: debian-11
      image: docker.io/library/debian
      arg: DISTRO_IMAGE

inputs:
  - images/podman/podman-debian-11-rootful/**
  - images/podman/platforms/debian-11/**
  - shared/oci-labels.env
