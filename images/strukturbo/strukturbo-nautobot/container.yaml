# yaml-language-server: $schema=../../../container.schema.json
schemaVersion: 1
name: strukturbo-nautobot
version: v0.3.0
image: ghcr.io/strukturpiloten/strukturbo-nautobot
title: Strukturbo Nautobot
description: Nautobot with DNS Models, Design Builder and scoped Strukturbo access
  intent, hardware observation review and permanent DNS owner/scope allocations
tests:
  nautobot: {}
lifecycle:
  state: experimental
  admission: isolated-test
  reviewAfter: '2026-12-31'
  supportBoundary: Candidate installed-artifact qualification; migration/restore,
    guest delivery and live rollout require separately retained acceptance.
  requiredRuntimeProfiles:
  - nautobot
build:
  githubActions: false
  context: .
  containerfile: images/strukturbo/strukturbo-nautobot/Containerfile
  architectures:
  - amd64
  runtimeBaseArg: BASE_IMAGE
  args:
    BASE_IMAGE:
      value: docker.io/networktocode/nautobot:3.2.9@sha256:5c7fad99171e853100e5b1ec186e5c858bc7b7b49d4dea8e520331efe0db5b02
      type: external-image
    DATABASE_IMAGE:
      value: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:48a0038fdd9672d12853d5300666b2592f97f9d34a993ea42e3ecb5a9a5e43e3
      type: external-image
    REDIS_IMAGE:
      value: docker.io/library/redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
      type: external-image
dependencies:
  internal: []
  external:
  - name: base
    image: docker.io/networktocode/nautobot
    arg: BASE_IMAGE
  - name: database
    image: ghcr.io/cloudnative-pg/postgresql
    arg: DATABASE_IMAGE
  - name: redis
    image: docker.io/library/redis
    arg: REDIS_IMAGE
inputs:
- images/strukturbo/**
- scripts/nautobot_source.py
- scripts/runtime_nautobot.py
- shared/oci-labels.env
