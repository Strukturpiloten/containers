[project]
name = "strukturpiloten-containers"
version = "0.1.0"
description = "Metadata-driven container monorepo tooling for Strukturpiloten OCI images"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Jinja2==3.1.6",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
  "ruff==0.16.6",
]

[tool.ruff]
fix = true
line-length = 120
target-version = "py314"

[tool.ruff.lint]
ignore = [
  "COM812",
  "CPY",
  "D203",
  "D213",
]
select = [
  "ALL",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "D101",
  "D102",
  "PT027",
  "PT009",
  "SLF001",
]
